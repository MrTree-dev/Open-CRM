name: open-crm

services:
  db:
    image: postgres:16
    container_name: crm_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crm_db
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: crm_redis
    ports:
      - "${REDIS_PORT}:6379"
    restart: unless-stopped

volumes:
  postgres_data: